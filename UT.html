<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>GST Invoice Book (offline)</title>
<style>
:root{--bg:#e9edf1;--panel:#fff;--ink:#14202e;--mute:#5d6b7a;--line:#d3dbe3;--navy:#0f2a43;--navy2:#1b3d5e;--amber:#e39a1b;--green:#1d7a4a;--red:#b3392b;--blue:#1e5fa8}
*{box-sizing:border-box}
html,body{margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.chrome{background:var(--navy);color:#fff;padding:18px 10px;position:sticky;top:0;height:100vh}
.chrome h1{font-size:16px;margin:0 8px 2px;font-weight:700}
.chrome .sub{font-size:12px;color:#9fb6cc;margin:0 8px 18px}
.chrome button{display:block;width:100%;text-align:left;background:none;border:0;color:#c9d8e6;padding:9px 10px;margin:2px 0;border-radius:6px;font:inherit;cursor:pointer;border-left:3px solid transparent}
.chrome button:hover{background:var(--navy2)}
.chrome button.on{background:var(--navy2);color:#fff;border-left-color:var(--amber)}
.chrome .foot{position:absolute;left:18px;right:10px;bottom:16px;font-size:11.5px;color:#8ba3bb}
main{padding:22px 26px 70px;min-width:0}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:15px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
label{display:block;font-size:12px;color:var(--mute);font-weight:600}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff;color:var(--ink);margin-top:3px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.amber{background:var(--amber);color:#1c1300}
.btn.red{background:var(--red)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--mute);font-size:12.5px}
table.t{width:100%;border-collapse:collapse;background:var(--panel)}
table.t th{font-size:12px;color:var(--mute);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:#f5f8fb}
.scroll{overflow-x:auto}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.chip.paid{background:#dcf1e5;color:var(--green)}.chip.part{background:#fdf0d2;color:#8a5a00}.chip.unpaid{background:#e3ecf6;color:var(--blue)}.chip.can{background:#f5dcd8;color:var(--red)}.chip.irn{background:#fdf0d2;color:#8a5a00}
.muted{color:var(--mute)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lines input{margin:0;padding:5px;min-width:0}
.lines td{padding:3px}
.lines th{font-size:11.5px;color:var(--mute);text-align:left;padding:3px}
.totbox{margin-left:auto;width:300px;font-variant-numeric:tabular-nums}
.totbox div{display:flex;justify-content:space-between;padding:3px 0}
.totbox .g{border-top:2px solid var(--ink);font-weight:700;font-size:16px;margin-top:4px;padding-top:6px}

.modal{position:fixed;inset:0;background:rgba(15,42,67,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.mbox{background:#fff;border-radius:8px;padding:18px;max-width:480px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:99}
.warn{background:#fdf0d2;border:1px solid #ecc977;padding:10px 14px;border-radius:6px;margin-bottom:14px}
.err{color:var(--red);font-size:12px}
@media (max-width:820px){.shell{grid-template-columns:1fr}.chrome{position:static;height:auto}.chrome .foot{display:none}}

/* ======== TAX INVOICE (print replica) ======== */
.paper{overflow-x:auto;padding-bottom:10px}
.inv{width:198mm;margin:0 auto;background:#fff;color:#000;border:1px solid #000;font:7.6pt/1.3 Tahoma,Verdana,Geneva,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv *{box-sizing:border-box}
.inv .hdr{display:grid;grid-template-columns:36mm 1fr 36mm;align-items:center;padding:1.5mm 2mm;min-height:34mm}
.inv .hdr .lg img{max-width:32mm;max-height:34mm;display:block}
.inv .hdr .qr{text-align:right}.inv .hdr .qr img{width:34mm;height:34mm;object-fit:contain}
.inv .co{text-align:center;font-size:7pt;line-height:1.35}
.inv .co .nm{font-size:11.5pt;font-weight:700;line-height:1.25;margin-bottom:.5mm}
.inv .co .em{margin-top:2.5mm}
.inv .ttl{background:#d9d9d9;border-top:1px solid #000;border-bottom:1px solid #000;text-align:center;padding:.8mm 0 .6mm}
.inv .ttl b{font-size:11pt;display:block;line-height:1.2}.inv .ttl small{font-size:5.8pt;display:block}
.inv .irn{display:flex;justify-content:space-between;gap:4mm;padding:.5mm 1.5mm;border-bottom:1px solid #000;font-size:6.6pt}
.inv .irn span{word-break:break-all}
.inv .mid{display:grid;grid-template-columns:62% 38%;border-bottom:1px solid #000}
.inv .ml{padding:1mm 1.5mm 0;display:flex;flex-direction:column}
.inv .mr{border-left:1px solid #000;display:flex;flex-direction:column}
.inv .u{text-decoration:underline;font-weight:700;margin-top:.8mm}
.inv .nm2{font-weight:700;font-size:8pt}
.inv .pre{white-space:pre-line}
.inv .kv2{display:grid;grid-template-columns:1fr 1fr;margin-top:.6mm}
.inv .k{display:inline-block;min-width:17mm}
.inv .k2{display:inline-block;min-width:20mm}
.inv .through{margin-top:auto;border-top:1px solid #000;margin-left:-1.5mm;margin-right:-1.5mm;padding:.6mm 1.5mm;font-size:7.6pt}
.inv .rg{display:grid;grid-template-columns:27mm 4mm 1fr;border-bottom:1px dotted #000;padding:.9mm 1.5mm .3mm;min-height:4.8mm}
.inv .rg.in{font-size:9pt}.inv .rg.in .v{font-weight:700;font-size:9.5pt}
.inv .rd{padding:.9mm 1.5mm;flex:1}
.inv .eway{display:grid;grid-template-columns:36% 36% 28%;border-bottom:1px solid #000;padding:.7mm 1.5mm;font-weight:700;font-size:7pt}
table.it{width:100%;border-collapse:collapse;table-layout:fixed}
.inv .it th{font-weight:700;border-bottom:1px solid #000;border-left:1px solid #000;padding:.8mm .5mm;text-align:center;font-size:7pt;line-height:1.15}
.inv .it td{border-left:1px solid #000;padding:.6mm 1mm;vertical-align:top;font-size:6.5pt}
.inv .it th:first-child,.inv .it td:first-child{border-left:0}
.inv .it td.r{text-align:right}.inv .it td.c{text-align:center}
.inv .it tfoot td{border-top:1px solid #000;border-bottom:1px solid #000;font-weight:700;padding:.8mm 1mm;font-size:7pt}
.inv .bot{display:grid;grid-template-columns:62% 38%;border-bottom:1px solid #000}
.inv .bl{padding:1.2mm 1.5mm}
.inv .br{border-left:1px solid #000;padding:1.2mm 2mm;font-size:7pt}
.inv .tx{display:grid;grid-template-columns:1fr 22mm 24mm;padding:.3mm 0}
.inv .tx .m{text-align:right}.inv .tx .a{text-align:right}
.inv .words{margin-top:2.2mm;font-size:8pt}
.inv .words div{margin-top:.6mm}
.inv .rt{display:grid;grid-template-columns:62% 38%;border-bottom:1px solid #000}
.inv .rt .rl{padding:1.2mm 1.5mm;font-size:7.2pt;min-height:9mm}
.inv .rt .rr{border-left:1px solid #000;padding:1mm 2mm;display:flex;justify-content:space-between;align-items:center;font-size:8pt}
.inv .rt .rs{font-size:15pt;margin:0 3mm 0 auto;font-weight:700}
.inv .rt .tot{font-size:10pt}
.inv .tw{padding:1.2mm 1.5mm;width:62%;font-size:8.2pt;font-weight:700;border-bottom:1px solid #000;border-right:0}
.inv .twrow{border-bottom:1px solid #000}
.inv .twrow .tw{border-bottom:0;width:62%}
.inv .tc{display:grid;grid-template-columns:62% 38%;min-height:30mm}
.inv .tcl{padding:1.2mm 1.5mm;font-size:6.1pt;line-height:1.55}
.inv .tcl .u{font-size:6.5pt}
.inv .tcr{border-left:1px solid #000;padding:1mm 1.5mm;display:flex;flex-direction:column;font-size:7pt}
.inv .tcr .cert{font-style:italic;font-size:6.4pt}
.inv .tcr .for{margin-top:1.5mm;text-align:right;font-weight:700;font-style:italic;font-size:7.2pt}
.inv .tcr .sig{margin-top:auto;border-top:1px solid #000;width:62%;margin-left:auto;text-align:right;font-weight:700;font-size:6.5pt;padding-top:.6mm}
.inv .bank{border-top:1px solid #000;padding:.9mm 1.5mm;font-weight:700;font-size:7pt}

@media print{
 @page{size:A4;margin:6mm}
 html,body{background:#fff}
 .chrome,.noprint,#toast{display:none!important}
 .shell{display:block}
 main{padding:0}
 .paper{overflow:visible;padding:0}
 .inv{margin:0}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="chrome" id="nav"></nav>
  <main id="app"></main>
</div>
<div id="toast"></div>

<script>
/* qrcode-generator 2.0.4 (MIT) inlined so the app works offline */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';

              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

</script>
<script>
/* =================== storage =================== */
const PUBLISHED = true;
const KEY = 'gstInvoiceBook.v1';
const DEF_DECL = 'I we hereby certify my/our Registration Certificate under the GST Act. 2017 is in force on the date on which the sale of the goods specified in this bill/cash memorandum is made by me/us and that the transaction of the sale covered by this bill/cash memorandum has been effected by me/us in the regular course of my/our business.';
function blankDB(){
  return {company:{name:'',works:'',email:'',state:'',stateCode:'',gstin:'',cin:'',pan:'',extra:'',logo:'',bank:'',prefix:'INV',startNo:1,gstRate:18,einv:false,loc:'',pin:'',declaration:DEF_DECL,terms:''},
          parties:[],invoices:[],payments:[],counters:{},audit:[]};
}
function loadDB(){
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);const b=blankDB();return Object.assign(b,o,{company:Object.assign(b.company,o.company||{})});}}catch(e){}
  return blankDB();
}
let db = loadDB();
let storageOK = true;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){storageOK=false;toast('Could not save in this browser. Use Backup > Export now.');}
}
function log(action,ref){db.audit.unshift({t:new Date().toISOString(),action,ref:ref||''});if(db.audit.length>500)db.audit.length=500;}

/* =================== helpers =================== */
function dialog(msg,o){
  o=o||{};
  return new Promise(res=>{
    const w=document.createElement('div');w.className='modal noprint';
    w.innerHTML='<div class="mbox"><div style="white-space:pre-line">'+esc(msg)+'</div>'+(o.input?'<input id="mi" style="margin-top:10px">':'')+'<div class="row" style="margin-top:14px;justify-content:flex-end">'+(o.cancel===false?'':'<button class="btn alt" id="mc">Cancel</button>')+'<button class="btn" id="mo">'+(o.ok||'OK')+'</button></div></div>';
    document.body.appendChild(w);
    const done=v=>{w.remove();res(v);};
    w.querySelector('#mo').onclick=()=>done(o.input?w.querySelector('#mi').value:true);
    const c=w.querySelector('#mc');if(c)c.onclick=()=>done(o.input?null:false);
    const i=w.querySelector('#mi');if(i)i.focus();
  });
}
const askYes=(m,ok)=>dialog(m,{ok:ok||'Yes, continue'});

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n=parseFloat(v); return isFinite(n)?n:0; };
const round2 = x => Math.round((x+Number.EPSILON)*100)/100;
const fmt2 = x => (x===''||x==null||isNaN(+x))?'':(+x).toFixed(2);
const fmt3 = x => (x===''||x==null||isNaN(+x))?'':(+x).toFixed(3);
const inr = x => (+x).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmy(d,short){if(!d)return '';const [y,m,da]=d.split('-');return da+'/'+MON[+m-1]+'/'+(short?y.slice(2):y);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hhmm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fyOf(d){const [y,m]=d.split('-').map(Number);const s=m>=4?y:y-1;return String(s).slice(2)+'-'+String(s+1).slice(2);}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200);}

/* Indian number words */
const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const b100=n=>n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');
const b1000=n=>{const h=Math.floor(n/100),r=n%100;return (h?ONES[h]+' Hundred'+(r?' ':''):'')+(r?b100(r):'');};
function intWords(n){
  if(n===0)return '';
  const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;const p=[];
  if(cr)p.push(intWords(cr)+(cr===1?' Crore':' Crores'));
  if(lk)p.push(b100(lk)+(lk===1?' Lac':' Lacs'));
  if(th)p.push(b100(th)+' Thousand');
  if(n)p.push(b1000(n));
  return p.join(' ');
}
function moneyWords(x){
  x=round2(Math.abs(x));const r=Math.floor(x),p=Math.round((x-r)*100);
  if(!r&&!p)return '';
  let s='';if(r)s+=intWords(r);if(p)s+=(r?' And ':'')+b100(p)+' Paise';
  return s+' ';
}

/* GSTIN check (format + checksum) */
function gstinProblem(g){
  g=(g||'').trim().toUpperCase();
  if(!g)return '';
  if(!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return 'GSTIN format looks wrong';
  const cs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';let sum=0;
  for(let i=0;i<14;i++){let p=cs.indexOf(g[i])*(i%2?2:1);sum+=Math.floor(p/36)+p%36;}
  return cs[(36-sum%36)%36]===g[14]?'':'GSTIN check digit does not match';
}

/* =================== GST maths =================== */
function calc(inv){
  const co=inv.co||db.company;
  const rate=num(inv.gstRate);
  const intra=String(inv.supplyTo).trim()===String(co.stateCode).trim();
  /* tax is rounded line by line (half-up) and then added up, as the e-invoice schema expects */
  const lines=inv.lines.map(l=>{
    const amtP=Math.round(num(l.weight)*num(l.rate)*100);
    let cg=0,sg=0,ig=0;
    if(intra){cg=Math.round(amtP*rate/200)/100;sg=cg;}else{ig=Math.round(amtP*rate/100)/100;}
    return Object.assign({},l,{amount:amtP/100,cgst:cg,sgst:sg,igst:ig});
  });
  const sum=k=>round2(lines.reduce((a,l)=>a+l[k],0));
  const taxable=sum('amount'),cgst=sum('cgst'),sgst=sum('sgst'),igst=sum('igst');
  const reels=lines.reduce((a,l)=>a+num(l.reels),0);
  const weight=lines.reduce((a,l)=>a+num(l.weight),0);
  const raw=taxable+cgst+sgst+igst,total=Math.round(raw),roundOff=round2(total-raw);
  return {lines,taxable,reels,weight,intra,rate,cgst,sgst,igst,roundOff,total};
}

/* =================== state =================== */
const S={view:'dash',draft:null,viewId:null,f:{q:'',st:'',from:'',to:''},party:null,pay:null,err:''};
const NAV=[['dash','Dashboard'],['invoices','Invoices'],['new','New invoice'],['parties','Contacts'],['payments','Payments'],['company','Company setup'],['backup','Backup']];
function go(v){S.view=v;if(v==='new'){S.draft=newDraft();S.err='';}if(v==='parties')S.party=null;if(v==='payments')S.pay=newPay();render();window.scrollTo(0,0);}

function paidOf(id){return round2(db.payments.filter(p=>p.invoiceId===id).reduce((a,p)=>a+num(p.amount),0));}
function balOf(inv){return round2(inv.totals.total-paidOf(inv.id));}
function stOf(inv){if(inv.status==='cancelled')return 'can';const b=balOf(inv);if(b<=0)return 'paid';return paidOf(inv.id)>0?'part':'unpaid';}
const ST={can:'Cancelled',paid:'Paid',part:'Part paid',unpaid:'Unpaid'};
function partyBal(pid){
  const p=db.parties.find(x=>x.id===pid);
  const inv=db.invoices.filter(i=>i.billId===pid&&i.status!=='cancelled').reduce((a,i)=>a+i.totals.total,0);
  const pay=db.payments.filter(x=>x.partyId===pid).reduce((a,x)=>a+num(x.amount),0);
  return round2(num(p&&p.opening)+inv-pay);
}

/* =================== render shell =================== */
function render(){
  $('nav').innerHTML='<h1>GST Invoice Book</h1><div class="sub">Works offline · data stays in this browser</div>'+
    NAV.map(([k,l])=>`<button class="${(S.view===k||(S.view==='view'&&k==='invoices'))?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+
    `<div class="foot">${db.invoices.length} invoices · ${db.parties.length} contacts</div>`;
  const V={dash:dashView,invoices:invoicesView,new:formView,view:viewView,parties:partiesView,payments:paymentsView,company:companyView,backup:backupView}[S.view];
  $('app').innerHTML=V();
  if(S.view==='invoices')renderList();
  if(S.view==='new'){updateTotals();noCheck();qrCheck();}
}

/* =================== dashboard =================== */
function dashView(){
  const fy=fyOf(todayISO());
  const act=db.invoices.filter(i=>i.status!=='cancelled');
  const fyInv=act.filter(i=>fyOf(i.date)===fy);
  const sales=fyInv.reduce((a,i)=>a+i.totals.total,0);
  const out=act.reduce((a,i)=>a+Math.max(0,balOf(i)),0);
  const recent=db.invoices.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
  const setup=!db.company.name?`<div class="warn"><b>Start here:</b> add your company details under <a href="#" onclick="go('company');return false">Company setup</a>, then add contacts and create your first invoice. Or <a href="#" onclick="loadSample();return false">load the sample data</a> (the Jodhani Papers invoice) to see the exact layout.</div>`:'';
  const sampleBtn=(!db.invoices.length)?`<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><b>Want to test it first?</b><div class="muted">Adds a sample company, two contacts and your Jodhani invoice, so you can try printing, searching, payments and creating new invoices.</div></div><button class="btn amber" onclick="loadSample()">Load sample data</button></div>`:'';
  return `<h2>Dashboard</h2>${sampleBtn}${setup}
  <div class="grid g4" style="margin-bottom:16px">
   <div class="stat"><div class="n">₹ ${inr(sales)}</div><div class="l">Sales in FY ${fy}</div></div>
   <div class="stat"><div class="n">₹ ${inr(out)}</div><div class="l">Outstanding from customers</div></div>
   <div class="stat"><div class="n">${fyInv.length}</div><div class="l">Invoices in FY ${fy}</div></div>
   <div class="stat"><div class="n">${db.parties.length}</div><div class="l">Contacts</div></div>
  </div>
  <div class="card"><h3>Recent invoices</h3>${recent.length?`<div class="scroll"><table class="t"><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="n">Amount</th><th>Status</th></tr>${recent.map(i=>`<tr style="cursor:pointer" onclick="openInv('${i.id}')"><td><b>${esc(i.no)}</b></td><td>${dmy(i.date)}</td><td>${esc(i.bill.name)}</td><td class="n">${inr(i.totals.total)}</td><td><span class="chip ${stOf(i)}">${ST[stOf(i)]}</span></td></tr>`).join('')}</table></div>`:'<p class="muted">No invoices yet. Choose New invoice to create one.</p>'}</div>`;
}

/* =================== invoice list =================== */
function invoicesView(){
  const f=S.f;
  return `<h2>Invoices</h2>
  <div class="card"><div class="row">
   <label style="flex:2;min-width:220px">Search<input id="fq" value="${esc(f.q)}" placeholder="Invoice no, customer, GSTIN, amount, e-way, truck" oninput="S.f.q=this.value;renderList()"></label>
   <label>Status<select onchange="S.f.st=this.value;renderList()">${[['','All'],['unpaid','Unpaid'],['part','Part paid'],['paid','Paid'],['can','Cancelled']].map(([v,l])=>`<option value="${v}" ${f.st===v?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>From<input type="date" value="${f.from}" onchange="S.f.from=this.value;renderList()"></label>
   <label>To<input type="date" value="${f.to}" onchange="S.f.to=this.value;renderList()"></label>
   <button class="btn" onclick="go('new')">New invoice</button>
  </div></div><div class="card" id="list"></div>`;
}
function renderList(){
  const f=S.f,q=f.q.trim().toLowerCase();
  const rows=db.invoices.filter(i=>{
    if(f.st&&stOf(i)!==f.st)return false;
    if(f.from&&i.date<f.from)return false;
    if(f.to&&i.date>f.to)return false;
    if(q){const hay=[i.no,i.bill.name,i.bill.gstin,i.ewayNo,i.truck,i.irn,String(i.totals.total),i.lrNo].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const tot=rows.filter(i=>i.status!=='cancelled').reduce((a,i)=>a+i.totals.total,0);
  $('list').innerHTML=rows.length?`<div class="scroll"><table class="t"><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="n">Amount</th><th class="n">Balance</th><th>Status</th><th></th></tr>
  ${rows.map(i=>`<tr><td><b>${esc(i.no)}</b>${(db.company.einv&&!i.irn&&i.status!=='cancelled')?' <span class="chip irn">IRN pending</span>':''}</td><td>${dmy(i.date)}</td><td>${esc(i.bill.name)}<div class="muted" style="font-size:12px">${esc(i.bill.gstin||'')}</div></td><td class="n">${inr(i.totals.total)}</td><td class="n">${i.status==='cancelled'?'-':inr(balOf(i))}</td><td><span class="chip ${stOf(i)}">${ST[stOf(i)]}</span></td><td style="white-space:nowrap"><button class="btn sm" onclick="openInv('${i.id}')">Open / print</button></td></tr>`).join('')}
  </table></div><p class="muted" style="margin:10px 0 0">${rows.length} invoices · total ₹ ${inr(tot)} (cancelled excluded)</p>`:'<p class="muted">No invoices match. Change the filters or create a new invoice.</p>';
}
function openInv(id){S.viewId=id;S.view='view';render();window.scrollTo(0,0);}

/* =================== invoice form =================== */
function blankLine(){return {desc:'',ord:'',hsn:'',bf:'',gsm:'',size:'',sizeUnit:'CM',reels:'',weight:'',unit:'KGS',rate:''};}
function autoNo(d){const fy=fyOf(d);return `${db.company.prefix||'INV'}/${fy}/${db.counters[fy]||db.company.startNo||1}`;}
function newDraft(){
  const d=todayISO();
  return {id:null,date:d,autoNo:true,no:autoNo(d),prep:hhmm(),rem:hhmm(),reverse:'No',lrNo:'',lrDt:'',truck:'',transporter:'',freight:'To Pay',driver:'',driverMobile:'',through:'',deliveryAt:'',ewayNo:'',ewayDt:'',distance:'',irn:'',ackNo:'',ackDt:'',qr:'',signedQr:'',gstRate:db.company.gstRate||18,supplyTo:'',remark:'',billId:'',shipId:'',lines:[blankLine()]};
}
async function editInv(id){
  const i=db.invoices.find(x=>x.id===id);
  if(i.irn&&!(await askYes('This invoice already has an IRN. Editing it will make it differ from the registered e-invoice. Continue?')))return;
  S.draft=JSON.parse(JSON.stringify(i));S.draft.autoNo=false;delete S.draft.totals;delete S.draft.co;delete S.draft.bill;delete S.draft.ship;
  S.err='';S.view='new';render();
}
function dupInv(id){
  const i=db.invoices.find(x=>x.id===id);const d=newDraft();
  ['billId','shipId','supplyTo','gstRate','through','transporter','freight','deliveryAt','truck','driver','driverMobile','reverse','remark'].forEach(k=>d[k]=i[k]);

}
const F=(l,k,t,ph,cls)=>`<label ${cls?`style="${cls}"`:''}>${l}<input id="f_${k}" type="${t||'text'}" value="${esc(S.draft[k])}" placeholder="${ph||''}" oninput="setD('${k}',this.value)"></label>`;
function partyOpts(sel,blank){return (blank?`<option value="">${blank}</option>`:'<option value="">Select contact</option>')+db.parties.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('');}

  </div><div class="err" id="noWarn"></div></div>

  <div class="card"><h3>Parties</h3><div class="grid g2">

   ${F('Supply to (state code)','supplyTo','text','e.g. 29')}
   ${F('Through','through')}
  </div>${gp?`<div class="err" style="margin-top:6px">Billed-to party: ${gp}</div>`:''}
  ${db.parties.length?'':'<p class="muted">No contacts yet. Add one under <a href="#" onclick="go(\'parties\');return false">Contacts</a>.</p>'}
  <label style="margin-top:10px">Delivery at (first line is the name, the rest is the address)<textarea id="f_deliveryAt" oninput="setD('deliveryAt',this.value)">${esc(d.deliveryAt)}</textarea></label></div>

  <div class="card"><h3>Transport and e-way bill</h3><div class="grid g4">
   ${F('L.R. no.','lrNo')}${F('L.R. date','lrDt','date')}${F('Truck no.','truck')}${F('Transporter','transporter')}
   ${F('Freight type','freight')}${F('Driver name','driver')}${F('Driver mobile','driverMobile')}${F('E-way bill no.','ewayNo')}
   ${F('E-way bill date','ewayDt','date')}${F('Distance (Km)','distance','number')}
  </div></div>

  <div class="card"><h3>E-invoice details <span class="muted" style="font-weight:400">(from the IRP portal; leave blank until you have them)</span></h3><div class="grid g4">

  </div>

  <label style="margin-top:10px">Signed QR text (SignedQRCode, starts with eyJ…). The app draws the QR from this, offline.<textarea id="f_signedQr" oninput="setD('signedQr',this.value);qrCheck()" style="min-height:60px;font-family:monospace;font-size:12px">${esc(d.signedQr||'')}</textarea></label>
  <div id="qrMsg" class="muted" style="font-size:12.5px"></div>

  <div class="card"><h3>Goods</h3>
   <datalist id="dl">${descs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>

function saveInv(open){

  rec.totals=calc(rec);delete rec.totals.lines;

}


/* =================== e-invoice QR =================== */
function qrSvg(text){
  try{
    let q;
    for(const ec of ['M','L']){try{q=qrcode(0,ec);q.addData(text,'Byte');q.make();break;}catch(e){q=null;}}
    if(!q)return '';
    const n=q.getModuleCount(),m=2;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" style="width:34mm;height:34mm"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(e){return '';}
}
function jwtPayload(t){
  try{
    const part=String(t).trim().split('.')[1];if(!part)return null;
    const b=part.replace(/-/g,'+').replace(/_/g,'/');
    const o=JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4)))));
    return typeof o.data==='string'?JSON.parse(o.data):(o.data||o);
  }catch(e){return null;}
}
function qrCheck(){
  const d=S.draft,e=$('qrMsg');if(!e)return;
  const t=(d.signedQr||'').trim();
  if(!t){e.className='muted';e.textContent='Paste the SignedQRCode text from the IRP to print the QR on the invoice.';return;}
  const p=jwtPayload(t);
  if(!p){e.className='err';e.textContent='This does not look like the signed QR text from the IRP (it should start with eyJ and contain two dots).';return;}
  const bad=[];
  if(p.DocNo&&p.DocNo!==d.no.trim())bad.push('invoice number is '+p.DocNo);
  const tot=calc(d).total;
  if(p.TotInvVal!=null&&Math.abs(num(p.TotInvVal)-tot)>1)bad.push('invoice value is '+p.TotInvVal);
  e.className=bad.length?'err':'muted';
  e.textContent=bad.length?'QR does not match this invoice: '+bad.join(', ')+'.':'QR text read OK'+(p.Irn?' · IRN '+String(p.Irn).slice(0,12)+'…':'')+(p.DocNo?' · '+p.DocNo:'');
  if(!bad.length&&p.Irn&&!d.irn){d.irn=p.Irn;const f=$('f_irn');if(f)f.value=p.Irn;}
}

function autoQrText(inv){
  const t=calc(inv),top=t.lines.slice().sort((a,b)=>b.amount-a.amount)[0]||{};
  const o={SellerGstin:inv.co.gstin,BuyerGstin:inv.bill.gstin||'',DocNo:inv.no,DocTyp:'INV',DocDt:dmy(inv.date).split('/').length?inv.date.split('-').reverse().join('/'):'',TotInvVal:t.total,ItemCnt:t.lines.length,MainHsnCode:String(top.hsn||'')};
  if(inv.irn)o.Irn=inv.irn;
  return JSON.stringify(o);
}
function invQr(inv){
  if(inv.signedQr&&jwtPayload(inv.signedQr))return qrSvg(inv.signedQr);
  if(inv.qr)return `<img src="${inv.qr}" alt="">`;
  return qrSvg(autoQrText(inv));
}
function importIRP(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast('That is not valid JSON');return;}
  const find=(x,k)=>{if(x&&typeof x==='object'){if(k in x)return x[k];for(const v of Object.values(x)){const r=find(v,k);if(r!=null)return r;}}return null;};
  const d=S.draft;let n=0;
  const irn=find(o,'Irn'),ack=find(o,'AckNo'),dt=find(o,'AckDt'),qr=find(o,'SignedQRCode');
  if(irn){d.irn=irn;n++;}if(ack){d.ackNo=String(ack);n++;}
  if(dt){d.ackDt=String(dt).slice(0,10);n++;}
  if(qr){d.signedQr=qr;n++;}
  if(!n){toast('No IRN, Ack or SignedQRCode found in that text');return;}
  toast('Filled '+n+' e-invoice fields');render();
}



/* =================== e-invoice JSON for the IRP (schema 1.1) =================== */
const addrFull=x=>String(x||'').replace(/^\s*works\s*:\s*/i,'').replace(/\s*\n\s*/g,', ').replace(/[\s,-]+$/,'').trim();
function addrParts(x){const a=addrFull(x);if(a.length<=100)return {Addr1:a};let k=a.lastIndexOf(' ',100);if(k<40)k=100;return {Addr1:a.slice(0,k).replace(/[\s,]+$/,''),Addr2:a.slice(k).trim().slice(0,100)};}
function irpProblems(inv){
  const c=inv.co,b=inv.bill,s=inv.ship||inv.bill,pr=[];
  const chk=(who,x,needG)=>{
    if(needG&&!x.gstin)pr.push(who+': GSTIN is required for e-invoicing');
    else if(x.gstin){const g=gstinProblem(x.gstin);if(g)pr.push(who+': '+g);}
    if(!/^\d{6}$/.test(String(x.pin||'').trim()))pr.push(who+': pincode must be 6 digits');
    if(String(x.loc||'').trim().length<3)pr.push(who+': city / location is required (3+ letters)');
    if(!String(x.address||x.works||'').trim())pr.push(who+': address is empty');
  };
  chk('Your company',c,true);chk('Billed-to '+b.name,b,true);
  if(inv.shipId&&inv.shipId!==inv.billId)chk('Shipped-to '+s.name,s,true);
  if(!/^[A-Za-z1-9][A-Za-z0-9\/-]{0,15}$/.test(inv.no))pr.push('Invoice number must be up to 16 letters, digits, / or -, and not start with 0, / or -');
  inv.lines.forEach((l,i)=>{if(!String(l.hsn).trim())pr.push('Line '+(i+1)+': HSN code is missing');if(!String(l.desc).trim())pr.push('Line '+(i+1)+': description is missing');});
  return pr;
}
function buildIRP(inv){
  const c=inv.co,b=inv.bill,s=inv.ship||inv.bill,t=calc(inv);
  const dt=x=>x?x.split('-').reverse().join('/'):'';
  const party=(x,addrSrc,pos)=>Object.assign({Gstin:String(x.gstin).trim().toUpperCase(),LglNm:x.name},pos?{Pos:String(pos).padStart(2,'0')}:{},addrParts(addrSrc),{Loc:String(x.loc).trim(),Pin:parseInt(x.pin,10),Stcd:String(x.stateCode).padStart(2,'0')});
  const o={Version:'1.1',
    TranDtls:{TaxSch:'GST',SupTyp:'B2B',RegRev:inv.reverse==='Yes'?'Y':'N',IgstOnIntra:'N'},
    DocDtls:{Typ:'INV',No:inv.no,Dt:dt(inv.date)},
    SellerDtls:party(c,c.works),
    BuyerDtls:party(b,b.address,inv.supplyTo)};
  if(inv.shipId&&inv.shipId!==inv.billId){const sp=party(s,s.address);o.ShipDtls=Object.assign({Gstin:sp.Gstin,LglNm:sp.LglNm,Addr1:sp.Addr1},sp.Addr2?{Addr2:sp.Addr2}:{},{Loc:sp.Loc,Pin:sp.Pin,Stcd:sp.Stcd});}
  o.ItemList=t.lines.map((l,i)=>({SlNo:String(i+1),PrdDesc:l.desc,IsServc:'N',HsnCd:String(l.hsn).trim(),Qty:+num(l.weight).toFixed(3),Unit:(l.unit||'KGS').toUpperCase().trim(),UnitPrice:+num(l.rate).toFixed(3),TotAmt:l.amount,AssAmt:l.amount,GstRt:t.rate,IgstAmt:l.igst,CgstAmt:l.cgst,SgstAmt:l.sgst,TotItemVal:round2(l.amount+l.cgst+l.sgst+l.igst)}));
  o.ValDtls={AssVal:t.taxable,CgstVal:t.cgst,SgstVal:t.sgst,IgstVal:t.igst,RndOffAmt:t.roundOff,TotInvVal:t.total};
  return o;
}
async function downloadIRP(id){
  const inv=db.invoices.find(x=>x.id===id),pr=irpProblems(inv);
  if(pr.length){await dialog('Fix these before exporting the e-invoice JSON:\n\n- '+pr.join('\n- ')+'\n\nAdd pincode and city under Contacts and Company setup.',{cancel:false});return;}
  download('einvoice-'+inv.no.replace(/[\\/:*?"<>|]/g,'-')+'.json',JSON.stringify([buildIRP(inv)],null,2),'application/json');
  log('e-invoice JSON exported',inv.no);save();toast('e-invoice JSON downloaded');
}

/* =================== direct PDF download (no print dialog needed) =================== */
function makePDF(jpeg,iw,ih){
  const PW=595.28,PH=841.89,M=17;
  let w=PW-2*M,h=w*ih/iw;if(h>PH-2*M){h=PH-2*M;w=h*iw/ih;}
  const x=M,y=PH-M-h,enc=t=>new TextEncoder().encode(t);
  const parts=[],offs=[];let len=0;
  const push=b=>{parts.push(b);len+=b.length;};
  const obj=(n,body)=>{offs[n]=len;push(enc(n+' 0 obj\n'+body+'\nendobj\n'));};
  push(enc('%PDF-1.4\n'));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4]=len;
  push(enc('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n'));
  push(jpeg);push(enc('\nendstream\nendobj\n'));
  const cs='q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x+' '+y.toFixed(2)+' cm /Im0 Do Q';
  obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  const xref=len;let t='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(t+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF'));
  return new Blob(parts,{type:'application/pdf'});
}
async function downloadPDF(name){
  const el=document.querySelector('.inv');if(!el)return;
  try{
    toast('Making PDF…');
    const r=el.getBoundingClientRect(),W=Math.ceil(r.width),H=Math.ceil(r.height);
    const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
    const xml=new XMLSerializer().serializeToString(el);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+W+'px;background:#fff"><style>'+css.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</style>'+xml+'</div></foreignObject></svg>';
    const img=new Image();
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
    const k=3,c=document.createElement('canvas');c.width=W*k;c.height=H*k;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    const b64=c.toDataURL('image/jpeg',0.93).split(',')[1],bin=atob(b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    download(name.replace(/[\\/:*?"<>|]/g,'-')+'.pdf',makePDF(u,c.width,c.height),'application/pdf');
    toast('PDF ready');
  }catch(e){console.error(e);toast('Could not make the PDF in this browser. Use Print instead, or open the file in Chrome or Edge.');}
}

function renderInvoice(inv){
  const c=inv.co,b=inv.bill,s=inv.ship||inv.bill,t=calc(inv);
  const T=(l,v)=>`<div class="rg"><span>${l}</span><span>:</span><span class="v">${v==null?'':esc(v)}</span></div>`;
  const da=(inv.deliveryAt||'').split('\n'),dfirst=da[0],drest=da.slice(1).join('\n');
  const n=t.lines.length,fill=Math.max(4,30-n*3.4);
  const rows=t.lines.map((l,i)=>`<tr><td class="c">${i+1}</td><td>${esc(l.desc)}</td><td class="c">${esc(l.ord)}</td><td class="c">${esc(l.hsn)}</td><td class="c">${esc(l.bf)}</td><td class="c">${esc(l.gsm)}</td><td class="r">${fmt2(l.size)}</td><td class="c">${esc(l.sizeUnit)}</td><td class="c">${esc(l.reels)}</td><td class="r">${fmt3(l.weight)}</td><td class="c">${esc(l.unit)}</td><td class="r">${fmt2(l.rate)}</td><td class="r">${fmt2(l.amount)}</td></tr>`).join('');
  const colw=[3.5,17,13,8,4,5,7,5,6,9.5,5,6.5,10.5];
  const txRows=`<div class="tx"><span>Taxable GST</span><span class="m">-&nbsp;&nbsp;&nbsp;:</span><span class="a">${fmt2(t.taxable)}</span></div>`+
    (t.intra?`<div class="tx"><span>CGST</span><span class="m">${t.rate/2===Math.round(t.rate/2)?(t.rate/2).toFixed(2):(t.rate/2)} % :</span><span class="a">${fmt2(t.cgst)}</span></div><div class="tx"><span>SGST</span><span class="m">${(t.rate/2).toFixed(2)} % :</span><span class="a">${fmt2(t.sgst)}</span></div>`
    :`<div class="tx"><span>IGST</span><span class="m">${t.rate.toFixed(2)} % :</span><span class="a">${fmt2(t.igst)}</span></div>`)+

function ledger(pid){
  const p=db.parties.find(x=>x.id===pid);
  const ev=[];
  db.invoices.filter(i=>i.billId===pid&&i.status!=='cancelled').forEach(i=>ev.push({d:i.date,t:'Invoice '+i.no,dr:i.totals.total,cr:0}));
  db.payments.filter(x=>x.partyId===pid).forEach(x=>ev.push({d:x.date,t:'Payment ('+x.mode+(x.ref?' '+x.ref:'')+')',dr:0,cr:num(x.amount)}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  let bal=num(p.opening);
  $('ledger').innerHTML=`<div class="card"><h3>Ledger: ${esc(p.name)}</h3><div class="scroll"><table class="t"><tr><th>Date</th><th>Details</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>
  <tr><td></td><td>Opening balance</td><td></td><td></td><td class="n">${inr(bal)}</td></tr>
  ${ev.map(e=>{bal=round2(bal+e.dr-e.cr);return `<tr><td>${dmy(e.d)}</td><td>${esc(e.t)}</td><td class="n">${e.dr?inr(e.dr):''}</td><td class="n">${e.cr?inr(e.cr):''}</td><td class="n">${inr(bal)}</td></tr>`;}).join('')}</table></div></div>`;

}

let DL=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});}catch(e){}
function download(name,text,type){
  const data=(text instanceof Blob)?text:new Blob([text],{type});
  if(DL){DL.save({filename:name,data}).then(()=>toast('Saved')).catch(e=>{if(!e||e.code!=='declined')toast('Could not save the file here ('+((e&&e.code)||'error')+')');});return;}
  toast('Saving files is not available in this view. Open the shared link in the Claude app or browser.');
}
function download_unused(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportJSON(){download('gst-invoice-backup-'+todayISO()+'.json',JSON.stringify(db),'application/json');log('Backup exported');save();}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const fr=new FileReader();fr.onload=async()=>{try{const o=JSON.parse(fr.result);if(!o.company||!Array.isArray(o.invoices))throw 0;if(!(await askYes('Replace all current data with this backup?','Replace')))return;db=Object.assign(blankDB(),o);save();toast('Backup restored');go('dash');}catch(e){toast('That file is not a valid backup');}};fr.readAsText(f);
}
function exportCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const h=['Invoice no','Date','Customer','GSTIN','Place of supply','Taxable','CGST','SGST','IGST','Round off','Total','Paid','Status','IRN','E-way bill'];
  const rows=db.invoices.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(i=>[i.no,i.date,i.bill.name,i.bill.gstin,i.supplyTo,i.totals.taxable,i.totals.cgst,i.totals.sgst,i.totals.igst,i.totals.roundOff,i.totals.total,paidOf(i.id),ST[stOf(i)],i.irn,i.ewayNo]);
  download('invoices-'+todayISO()+'.csv','\ufeff'+[h,...rows].map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
